<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow-ups · Nutrition Hub</title>
<link rel="icon" href="/img/mark.png">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/i18n.js"></script>
<script src="/js/i18n-ar.js"></script>

<style>
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .fchips { display: flex; gap: 8px; flex-wrap: wrap; }
    .fchip { min-height: 36px; padding: 5px 14px; font-size: .86rem; background: var(--surface); border: 1px solid var(--line); }
    .fchip i { width: 8px; height: 8px; border-radius: 50%; }
    .fchip b { font-family: var(--display); font-weight: 500; font-variant-numeric: tabular-nums; }
    .fchip.active { background: var(--deep); color: var(--deep-ink); border-color: var(--deep); }
    .filters { display: grid; grid-template-columns: minmax(0, 1fr) 210px 170px; gap: 10px; }
    .listbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .86rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; align-items: start; }
    .case { position: relative; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; transition: box-shadow .25s, transform .25s; }
    .case:hover { box-shadow: var(--shadow-lift); }
    .case.urgent::before { content: ""; position: absolute; inset-block: 18px; inset-inline-start: 0; width: 3px; border-radius: 3px; background: var(--coral); }
    .case-body { padding: 20px 22px 14px; flex: 1; }
    .case-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .hn { font-family: var(--mono); font-size: 1.12rem; font-weight: 500; letter-spacing: .04em; }
    .loc { color: var(--ink-2); font-size: .92rem; margin-top: 2px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    .next { margin-top: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .next .what { font-weight: 500; }
    .next .when { color: var(--muted); font-size: .86rem; white-space: nowrap; }
    .owner { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: .85rem; }
    .owner .avatar { width: 24px; height: 24px; font-size: .64rem; }
    .plan { margin-top: 14px; font-size: .87rem; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; color: var(--ink-2); }
    .plan b { color: var(--ink); font-weight: 600; }
    .pending { margin-top: 14px; background: var(--amber-soft); border-radius: 14px; padding: 10px 12px; font-size: .87rem; }
    .pending q { display: block; margin-top: 4px; color: var(--ink-2); font-style: italic; }
    .actions { display: flex; gap: 8px; align-items: center; padding: 12px 16px 16px; }
    .actions .spacer { flex: 1; }

    /* "More" menu */
    details.menu { position: relative; }
    details.menu > summary { list-style: none; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); font-weight: 700; letter-spacing: 1px; }
    details.menu > summary::-webkit-details-marker { display: none; }
    details.menu > summary:hover, details.menu[open] > summary { background: var(--surface-2); color: var(--ink); }
    .menu-pop { position: absolute; inset-inline-end: 0; bottom: calc(100% + 6px); z-index: 15; min-width: 220px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lift); padding: 6px; display: flex; flex-direction: column; }
    .menu-pop button { justify-content: flex-start; text-align: start; white-space: nowrap; border: 0; border-radius: 10px; background: transparent; min-height: 38px; font-size: .9rem; padding: 6px 12px; }
    .menu-pop button:hover { background: var(--surface-2); }
    .menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

    .activity { border-top: 1px solid var(--line); padding: 12px 22px 16px; font-size: .85rem; color: var(--ink-2); }
    .activity p { margin: 0 0 10px; }
    .activity small { color: var(--muted); }

    .empty { grid-column: 1 / -1; text-align: center; padding: 56px 20px; border-radius: var(--radius); color: var(--muted); background: var(--surface); box-shadow: var(--shadow); }
    .empty strong { display: block; font-family: var(--display); font-weight: 500; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }

    .loc-group + .loc-group { margin-top: 12px; }
    .loc-group .small { margin-bottom: 6px; }
    .plan-box { border-radius: 16px; background: var(--surface-2); padding: 14px 16px; }
    .plan-box summary { cursor: pointer; font-weight: 500; font-size: .92rem; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 700px) {
        .filters { grid-template-columns: 1fr 1fr; }
        .filters input { grid-column: 1 / -1; }
        .cards { grid-template-columns: 1fr; }
        .two, .three { grid-template-columns: 1fr 1fr; }
    }
</style>
</head>
<body>
<main class="wrap stack page">
    <div class="page-head">
        <div>
            <span class="eyebrow" id="date">&nbsp;</span>
            <h1>Follow-ups</h1>
            <p class="lede" id="lede">Loading…</p>
        </div>
        <button class="primary" id="add-btn" disabled><span aria-hidden="true">＋</span> Add patient</button>
    </div>

    <div class="notice warn" id="notice" hidden role="status"></div>

    <div class="toolbar">
        <div class="segmented" role="tablist" aria-label="Lists">
            <button role="tab" data-view="mine" aria-selected="true">My patients</button>
            <button role="tab" data-view="handovers" aria-selected="false">Handovers <span class="count" id="ho-count" hidden></span></button>
            <button role="tab" data-view="team" aria-selected="false">Department</button>
            <button role="tab" data-view="closed" aria-selected="false">Closed</button>
        </div>
        <div class="fchips" aria-label="Filter by review timing">
            <button class="fchip" data-filter="overdue"><i class="dot-coral" style="background:var(--coral)"></i>Overdue <b id="c-overdue">0</b></button>
            <button class="fchip" data-filter="today"><i style="background:#D9A23B"></i>Today <b id="c-today">0</b></button>
            <button class="fchip" data-filter="upcoming"><i style="background:var(--teal)"></i>Upcoming <b id="c-upcoming">0</b></button>
        </div>
    </div>

    <div class="filters">
        <input type="search" id="search" placeholder="Search hospital number, ward or dietitian" aria-label="Search">
        <select id="loc-filter" aria-label="Filter by ward or clinic"><option value="">All wards &amp; clinics</option></select>
        <select id="setting-filter" aria-label="Filter by setting">
            <option value="">In- &amp; outpatients</option>
            <option value="inpatient">Inpatients</option>
            <option value="outpatient">Outpatients</option>
        </select>
    </div>

    <div class="listbar">
        <span id="list-count"></span>
        <span class="row" style="gap:14px">
            <span id="sync">Connecting…</span>
            <button class="link small" id="refresh-btn" type="button">Refresh</button>
            <button class="link small" id="export-btn" type="button">Export CSV</button>
        </span>
    </div>

    <section class="cards" id="list" aria-live="polite"></section>

    <footer class="site">Hospital numbers and follow-up tasks only; patient names, diagnoses and clinical notes stay in Al Shifa. Closed cases are deleted automatically <span id="retention"></span> after closing. Every change records who made it.</footer>
</main>

<dialog id="dlg">
    <form id="form" novalidate>
        <div class="dialog-head">
            <div><span class="eyebrow" id="dlg-eyebrow"></span><h2 id="dlg-title"></h2></div>
            <button type="button" class="icon-btn" id="dlg-x" aria-label="Close">✕</button>
        </div>
        <div class="form-grid" id="fields"></div>
        <p class="form-error" id="form-error" role="alert"></p>
        <div class="dialog-actions">
            <button type="button" class="ghost" id="dlg-cancel">Cancel</button>
            <button type="submit" class="primary" id="dlg-submit">Save</button>
        </div>
    </form>
</dialog>

<script type="module" src="/js/followup.js"></script>
</body>
</html>
