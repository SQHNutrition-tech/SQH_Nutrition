name = "sqh-nutrition-hub"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The hub starts on its *.workers.dev address (no custom domain yet), protected
# by Cloudflare Access (Worker → Settings → Domains & Routes → Enable Cloudflare
# Access). Until ACCESS_TEAM_DOMAIN and ACCESS_AUD below are filled in, the
# Worker refuses every request. Once a custom domain is added, set
# workers_dev = false. Preview URLs stay off.
workers_dev = true
preview_urls = false

# Pages, scripts and styles in ./public. run_worker_first makes every request,
# including static pages, pass the Worker's sign-in check, so nothing is
# readable even if the Cloudflare Access application is misconfigured.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "sqh-nutrition-hub"
database_id = "07ffb038-ed08-4f1a-b3ad-3fddc742fc7f"
migrations_dir = "migrations"

# Daily retention clean-up at 02:00 Oman time (22:00 UTC).
[triggers]
crons = ["0 22 * * *"]

[vars]
# Your Zero Trust team domain, e.g. "sqh-nutrition.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "curly-cell-e5dc.cloudflareaccess.com"
# "Application Audience (AUD) Tag" from the Access application's settings
ACCESS_AUD = "a7a7394b55d1e3ba8b6c740dd980c5e755a2e70d735a4e85f236aa88d30feff9"
# Comma-separated emails that are always admins (bootstrap)
ADMIN_EMAILS = "thuraiyaalrawas@gmail.com"
